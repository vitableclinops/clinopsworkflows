name: ClinOps Weekly Sync — Post-Meeting Automation

on:
  schedule:
    # 12:45 PM CDT (UTC-5) = 17:45 UTC — active Mar through Nov
    - cron: '45 17 * * 2'
    # 12:45 PM CST (UTC-6) = 18:45 UTC — active Nov through Mar
    - cron: '45 18 * * 2'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

jobs:
  meeting-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Run meeting-summary skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >
            Run /meeting-summary ClinOps Weekly Sync

            ${{ inputs.date && format('Use meeting notes from {0}.', inputs.date) || '' }}
          mcp_config: |
            {
              "mcpServers": {
                "Granola": {
                  "command": "npx",
                  "args": ["-y", "@granola-inc/mcp-server"],
                  "env": {
                    "GRANOLA_API_TOKEN": "${{ secrets.GRANOLA_API_TOKEN }}"
                  }
                },
                "Slack": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-slack"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}"
                  }
                },
                "Linear": {
                  "command": "npx",
                  "args": ["-y", "@linear/mcp-server"],
                  "env": {
                    "LINEAR_API_KEY": "${{ secrets.LINEAR_API_KEY }}"
                  }
                }
              }
            }
