name: Daily Appointment Availability Report

on:
  schedule:
    # 8:00 AM CDT (UTC-5) = 13:00 UTC — active Mar through Nov
    - cron: '0 13 * * 1-5'
    # 8:00 AM CST (UTC-6) = 14:00 UTC — active Nov through Mar
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

jobs:
  availability-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run daily availability report
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: .claude/commands/daily-availability-report.md
          claude_args: >-
            --allowedTools mcp__Slack__slack_send_message,mcp__Slack__slack_search_channels
          mcp_config: |
            {
              "mcpServers": {
                "Slack": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-slack"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
                    "SLACK_TEAM_ID": "${{ secrets.SLACK_TEAM_ID }}"
                  }
                }
              }
            }
