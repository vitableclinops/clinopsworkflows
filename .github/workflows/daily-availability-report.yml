name: Daily Appointment Availability Report

on:
  schedule:
    # 8:00 AM CDT (UTC-5) = 13:00 UTC — active Mar through Nov
    - cron: '0 13 * * 1-5'
    # 8:00 AM CST (UTC-6) = 14:00 UTC — active Nov through Mar
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

jobs:
  availability-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily availability report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SCHEDULING_API_URL: ${{ vars.SCHEDULING_API_URL }}
          SCHEDULING_API_TOKEN: ${{ secrets.SCHEDULING_API_TOKEN }}
          SCHEDULING_SLOTS_KEY: ${{ vars.SCHEDULING_SLOTS_KEY || 'slots' }}
          WORKFLOW_DATE: ${{ inputs.date }}
        run: python src/availability_report.py
