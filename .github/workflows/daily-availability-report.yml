name: Daily Appointment Availability Report

on:
  schedule:
    # 8:00 AM CDT (UTC-5) = 13:00 UTC — active Mar through Nov
    - cron: '0 13 * * *'
    # 8:00 AM CST (UTC-6) = 14:00 UTC — active Nov through Mar
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

jobs:
  daily-availability-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run daily availability report
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run /tddaily-availability-report to generate today's appointment availability report and post it to #appointment-availability-update in Slack.
            ${{ inputs.date && format('Target date: {0}', inputs.date) || '' }}
          mcp_config: |
            {
              "mcpServers": {
                "slack": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-slack"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
                    "SLACK_TEAM_ID": "${{ secrets.SLACK_TEAM_ID }}"
                  }
                },
                "jotform": {
                  "command": "npx",
                  "args": ["-y", "@jotform/mcp-server"],
                  "env": {
                    "JOTFORM_API_KEY": "${{ secrets.JOTFORM_API_KEY }}"
                  }
                }
              }
            }
